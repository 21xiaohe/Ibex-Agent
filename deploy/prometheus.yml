global:
  scrape_interval: 5s
scrape_configs:
  - job_name: ibex-web
    static_configs:
      - targets: ['web:8000']
    authorization:
      credentials_file: /run/secrets/web_metrics_token
  - job_name: ibex-worker
    static_configs:
      - targets: ['worker:8002']
  - job_name: ibex-sandbox
    static_configs:
      - targets: ['sandbox:8003']
    authorization:
      credentials_file: /run/secrets/sandbox_token
